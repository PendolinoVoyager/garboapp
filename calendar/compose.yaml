version: '3.8'

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: calendar_local_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  testdb:
    image: postgres:17
    environment:
      POSTGRES_DB: calendar_local_test_db
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5433:5432"
    labels:
        org.springframework.boot.ignore: true

volumes:
  pgdata:
